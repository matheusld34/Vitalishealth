                    "on-surface": "#191c1e",
                    "background": "#f8f9fb",
                    "inverse-surface": "#2e3132",

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #0052cc;
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-background">
<!-- Top Section: Branded Background -->
<header class="relative flex flex-col items-center justify-center h-[35vh] bg-primary-container overflow-hidden">
<!-- Decorative Mesh Gradient Background Layer -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-white blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-on-primary-container blur-[100px]"></div>
</div>
<!-- Logo -->
<div class="relative z-10 p-4 bg-surface-container-lowest rounded-xl shadow-lg transform transition-transform duration-500 hover:scale-105">
<img alt="NexusAuth Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtBE2JGEOQW4CVXBdh8ETWpfVI9902FCyPAiP27ywAw7ykrmyQrcQ-mKig5Si_a8Zp7q4hB8OmpbSQIyGBXMIXqd2p9SGQe7c2s2y55BsWlgfyIzhMT1KyQfI-jY94QbCnOC7PxwRJr5LwapE3xS3N7L-9TC-v76HDjsZv6br3VLX-cWJ-OXCJZGIXv1P0q3iceJ-LVyaTMuG2yhOeCUr1xus61JPKBpm32RULROSIOFt-Od79xrAMx0_M"/>
</div>
<h1 class="mt-6 text-headline-lg-mobile font-headline-lg-mobile text-on-primary-container tracking-tight">NexusAuth</h1>
</header>
<!-- Bottom Section: Form -->
<main class="flex-grow flex flex-col bg-surface-container-lowest rounded-t-[32px] -mt-8 relative z-20 px-8 pt-10 pb-12 shadow-2xl md:max-w-login md:mx-auto md:mt-12 md:rounded-xl md:mb-12">
<div class="mb-8">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-background mb-2">Bem-vindo de volta</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Acesse sua conta para continuar.</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<!-- E-mail Field -->
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F4F5F7] border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:bg-white transition-all input-focus-ring" id="email" placeholder="nome@empresa.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="password">Senha</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F4F5F7] border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:bg-white transition-all input-focus-ring" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-white font-label-sm text-label-sm py-4 rounded-lg shadow-md active:scale-95 transition-all duration-150 hover:bg-primary" type="button">
                Entrar
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-helper-text font-helper-text text-outline">Ou entre com</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container transition-colors active:scale-95 duration-150" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-label-sm font-label-sm text-on-surface-variant">Entrar com Google</span>
</button>
<!-- Footer Link -->
<div class="mt-auto pt-10 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                Não tem uma conta? 
                <a class="text-primary font-bold hover:underline" href="#">Criar nova conta</a>
</p>
</div>
</main>
<!-- Shared Bottom Nav (Suppressed for focused login) -->
<!-- Determined suppression based on "Task-Focused" rule -->
<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#0052cc';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#737685';
            });
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button span[data-icon="visibility"]' || 'button .material-symbols-outlined:last-child');
        if (toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    </script>
</body></html>
