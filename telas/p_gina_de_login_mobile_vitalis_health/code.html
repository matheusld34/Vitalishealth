<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        body {
            background-color: #f8f9fa;
        }
        .soft-shadow {
            box-shadow: 0px 4px 20px rgba(80, 166, 132, 0.05);
        }

<body class="font-body-base text-on-surface">
<!-- TopAppBar Section -->
<header class="w-full top-0 bg-surface flex items-center justify-center py-6 px-margin-mobile w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="spa">spa</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary">Vitalis Health</h1>
</div>
</header>
<main class="min-h-[calc(100vh-180px)] flex flex-col">
<!-- Brand Header Section -->
<section class="bg-primary-container/10 py-12 flex flex-col items-center justify-center">
<div class="w-24 h-24 mb-4 rounded-xl flex items-center justify-center">
<img alt="Vitalis Health Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuwRcdKyhZsc5apP-y6--yUQ_CEdeT60IkFb0iqi4VkQ1PVDaMe1tz9Mz4mKMtI7btxpalMJzto93aex3T1l-eAuK933MLkIQtHvqSA_PSExNy5X4ISEnIKtpXpdjPPiwcNeAzF09GyEBi0j7VfAR0kIA-U-xhK8V4RevXpCHvaXX-9wgPx4eGJjnL6QQ63G3PUGNyzi4chgLFiVcXvgGTCt3og9XO4HUGk5MfE3GpUhp3vhTsVhw0oPbLh">
</div>
<h2 class="font-headline-md text-headline-md text-primary-container">Vitalis Health</h2>
</section>
<!-- Login Card Section -->
<section class="px-margin-mobile -mt-8 mb-12">
<div class="bg-surface-container-lowest rounded-lg p-8 soft-shadow max-w-md mx-auto">
<div class="text-center mb-8">
<h3 class="font-headline-md text-headline-md text-on-surface">Bem-vindo de volta</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Acesse sua conta para continuar</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- E-mail -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-outline" for="email">E-MAIL</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-base text-body-base" id="email" placeholder="seu@email.com" type="email">
</div>
</div>
<!-- Senha -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-outline" for="password">SENHA</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-base text-body-base" id="password" placeholder="••••••••" type="password">
</div>
<div class="flex justify-end">
<a class="font-body-sm text-body-sm text-primary font-semibold hover:underline" href="#">Esqueceu a senha?</a>
</div>
</div>
<!-- Entrar Button -->
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-headline-md text-body-base font-bold shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2" type="submit">
                        Entrar
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8 flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-body-sm text-body-sm text-outline">Ou entre com</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Login -->
<button class="w-full py-3 border-2 border-outline-variant text-on-surface-variant rounded-lg font-body-base flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Não tem uma conta? 
                        <a class="text-primary font-bold hover:underline" href="#">Criar nova conta</a>
</p>
</div>
</div>
</section>
</main>
<!-- Footer Section -->
<footer class="w-full bottom-0 bg-transparent flex flex-col items-center justify-center gap-gutter py-8 px-margin-mobile w-full">
<div class="flex gap-4">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Privacidade</a>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Termos de Uso</a>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Suporte</a>
</div>
<p class="font-body-sm text-body-sm text-secondary text-center">
            © 2024 Vitalis Health. Cuidando de você com empatia.
        </p>
</footer>
<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.95)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Simple form validation visual feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#006c4e';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#6f7a73';
            });
        });
    </script>
</body></html>
